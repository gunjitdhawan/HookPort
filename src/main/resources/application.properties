spring.application.name=hookport

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hookport}
spring.datasource.username=${DATABASE_USERNAME:hookport}
spring.datasource.password=${DATABASE_PASSWORD:hookport_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

hookport.delivery.scheduling-enabled=true
hookport.delivery.poll-interval-ms=1000
hookport.delivery.batch-size=20
hookport.delivery.max-attempts=5
hookport.delivery.base-delay-seconds=30
hookport.delivery.max-delay-seconds=3600
hookport.delivery.stuck-timeout-seconds=30
hookport.delivery.recovery-batch-size=20

hookport.security.allow-private-targets=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=hookport

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level thread=%thread logger=%logger{36} correlationId=%X{correlationId:-} deliveryId=%X{deliveryId:-} eventId=%X{eventId:-} attemptId=%X{attemptId:-} attemptNumber=%X{attemptNumber:-} message="%msg"%n
